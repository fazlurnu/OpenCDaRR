[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencdarr"
version = "0.0.0"
description = "Conflict detection, resolution & recovery research platform (BlueSky as a library)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Runtime deps are kept minimal on purpose (design-philosophy #10, #12): add a
# dependency only when a file that ships needs it. numpy is here because rng.py
# (SeedSequence.spawn) and state.py need it from Phase 0. pyyaml arrives in Step 2
# with the config loader, not before.
#
# joblib joined the core in Aug 2026. Parallel IPS is the workflow this platform exists for,
# not a side capability, and at 2.5 MB against numpy's 35 MB the "keep it optional" rule was
# only buying a confusing ImportError halfway through a sweep. scipy stayed out (see the
# `fast` extra): 99 MB for a ~1.5x speedup on one criterion is the case the rule IS for.
#
# There is no BlueSky runtime dependency (ADR 0003): the geodesy is ours (opencdarr/geo.py).
# BlueSky is used only as an OFFLINE validation anchor: scripts/fixedwing_bluesky_comparison.py
# transcribes its model rather than importing it, and docs/fixedwing-vs-bluesky.md records the
# comparison (it is a custom fork, not the unrelated PyPI "bluesky"; install separately where
# needed, e.g. the `cdarr` conda env or `pip install -e ~/Projects/bluesky`).
dependencies = [
    "numpy>=1.26,<3",
    "pyyaml>=6",
    "joblib>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
]
# There is no `parallel` extra: joblib moved into the core dependencies above (Aug 2026), so the
# extra would have been an empty alias with nothing left to install. `pip install 'opencdarr[parallel]'`
# now warns that the extra is unknown and installs the core, which already has joblib.
#
# Optional speed only, never required and never a change in results. ProbabilisticFTR's angular
# quadrature calls erf three times per evaluation over the whole grid; scipy's is a true ufunc
# where the fallback is a Python loop, worth ~1.5x on that criterion and nothing anywhere else.
# The two agree to 2e-16. Everything works without it.
fast = ["scipy>=1.10"]
# Everything the example notebooks need: the plotter (opencdarr/viz.py) imports matplotlib
# lazily, and a Jupyter kernel to run the notebooks. Kept out of the core install so a plain
# `pip install opencdarr` stays lean (design-philosophy #10). The rare-event notebook fills the
# machine with opencdarr.estimate.parallel, but that needs nothing here: joblib is a core dep.
# pandas backs ExperimentResults.frame(), which is the notebook-facing view of a sweep and the
# extra that its ModuleNotFoundError already tells the user to install.
examples = [
    "matplotlib>=3.7",
    "ipykernel>=6",
    "pandas>=2",
]

[tool.setuptools.packages.find]
include = ["opencdarr*"]

# --- Type hints, enforced by the machine, not by willpower -------------------
# "type hints everywhere" is a standing project rule; strict mode makes an
# un-annotated function an error, so the rule cannot quietly erode.
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
files = ["opencdarr", "tests"]

# numpy ships types, but pin the plugin behaviour explicitly for reproducibility.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "normal"

# BlueSky ships no type stubs / py.typed marker; treat it as untyped at any boundary that
# imports it rather than weakening strict mode everywhere.
[[tool.mypy.overrides]]
module = ["bluesky.*"]
ignore_missing_imports = true

# yaml stubs (types-PyYAML) aren't a runtime dep; treat the import as untyped at config.py.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

# matplotlib is an optional (examples) dependency, imported lazily by opencdarr/viz.py and not
# always installed; treat it as untyped at that boundary rather than requiring the stubs.
[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

# joblib ships no py.typed marker and is an optional (parallel) dependency, imported lazily by
# opencdarr/estimate/parallel.py; same treatment as matplotlib — untyped at the one boundary that uses it.
[[tool.mypy.overrides]]
module = ["joblib.*"]
ignore_missing_imports = true

# --- Lint / format -----------------------------------------------------------
[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I import-sort, UP pyupgrade, B bugbear, N naming.
# N is deliberate: "name it like the paper" (design-philosophy #6) still wants
# consistent Python naming for the plumbing around the domain terms.
select = ["E", "F", "I", "UP", "B", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
