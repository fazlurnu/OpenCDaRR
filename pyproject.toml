[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencdarr"
version = "0.0.0"
description = "Conflict detection, resolution & recovery research platform (BlueSky as a library)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Runtime deps are kept minimal on purpose (design-philosophy #10, #12): add a
# dependency only when a file that ships needs it. numpy is here because rng.py
# (SeedSequence.spawn) and state.py need it from Phase 0. pyyaml arrives in Step 2
# with the config loader, not before.
#
# Shipping code depends only on numpy (ADR 0003): the geodesy is ours (opencdarr/geo.py),
# so there is no BlueSky runtime dependency. BlueSky is used only as an OFFLINE validation
# anchor: scripts/fixedwing_bluesky_comparison.py transcribes its model rather than importing
# it, and docs/fixedwing-vs-bluesky.md records the comparison (it is a custom fork, not the
# unrelated PyPI "bluesky"; install separately where needed, e.g. the `cdarr` conda env or
# `pip install -e ~/Projects/bluesky`).
dependencies = [
    "numpy>=1.26,<3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
]
# Spreading an estimator over CPU cores (opencdarr/parallel.py), which imports joblib lazily so
# the core install stays numpy-only and the serial estimators keep working without it.
# >=1.2 is the floor actually exercised; nothing here uses a 1.3-only feature.
parallel = ["joblib>=1.2"]
# Optional speed only, never required and never a change in results. ProbabilisticFTR's angular
# quadrature calls erf three times per evaluation over the whole grid; scipy's is a true ufunc
# where the fallback is a Python loop, worth ~1.5x on that criterion and nothing anywhere else.
# The two agree to 2e-16. Everything works without it.
fast = ["scipy>=1.10"]
# Everything the example notebooks need: the plotter (opencdarr/viz.py) imports matplotlib
# lazily, and a Jupyter kernel to run the notebooks. Kept out of the core install so a plain
# `pip install opencdarr` stays numpy-only (design-philosophy #10).
examples = [
    "matplotlib>=3.7",
    "ipykernel>=6",
    "opencdarr[parallel]",   # the rare-event notebook fills the machine with opencdarr.parallel
]

[tool.setuptools.packages.find]
include = ["opencdarr*"]

# --- Type hints, enforced by the machine, not by willpower -------------------
# "type hints everywhere" is a standing project rule; strict mode makes an
# un-annotated function an error, so the rule cannot quietly erode.
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
files = ["opencdarr", "tests"]

# numpy ships types, but pin the plugin behaviour explicitly for reproducibility.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "normal"

# BlueSky ships no type stubs / py.typed marker; treat it as untyped at any boundary that
# imports it rather than weakening strict mode everywhere.
[[tool.mypy.overrides]]
module = ["bluesky.*"]
ignore_missing_imports = true

# yaml stubs (types-PyYAML) aren't a runtime dep; treat the import as untyped at config.py.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

# matplotlib is an optional (examples) dependency, imported lazily by opencdarr/viz.py and not
# always installed; treat it as untyped at that boundary rather than requiring the stubs.
[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

# joblib ships no py.typed marker and is an optional (parallel) dependency, imported lazily by
# opencdarr/parallel.py; same treatment as matplotlib — untyped at the one boundary that uses it.
[[tool.mypy.overrides]]
module = ["joblib.*"]
ignore_missing_imports = true

# --- Lint / format -----------------------------------------------------------
[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I import-sort, UP pyupgrade, B bugbear, N naming.
# N is deliberate: "name it like the paper" (design-philosophy #6) still wants
# consistent Python naming for the plumbing around the domain terms.
select = ["E", "F", "I", "UP", "B", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
